baseURL = "https://sdjhk123.github.io/"
title = "Sdjhk123"
theme = "PaperMod"

defaultContentLanguage = "zh"
locale = "zh-cn"
hasCJKLanguage = true
enableRobotsTXT = true
summaryLength = 70
timeZone = "Asia/Shanghai"

[pagination]
pagerSize = 10

[outputs]
home = ["HTML", "RSS", "JSON"]

[params]
env = "production"
description = "记录个人随笔"
keywords = ["文学", "技术", "杂感"]
author = "Sdjhk123"
DateFormat = "2006-01-02"
defaultTheme = "auto"
disableThemeToggle = false
comments = true

ShowReadingTime = true
ShowShareButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
ShowFullTextinRSS = true
ShowToc = true
TocOpen = false

[params.homeInfoParams]
Title = "Sdjhk123"
Content = "这里记录我日常的一些随笔，覆盖范围广，比较随意。"

[[params.socialIcons]]
name = "github"
url = "https://github.com/sdjhk123"

[[params.socialIcons]]
name = "rss"
url = "/index.xml"

[params.fuseOpts]
isCaseSensitive = false
includeScore = true
minMatchCharLength = 2
keys = ["title", "permalink", "summary", "content"]

# Giscus 评论：数据存于本仓库的 GitHub Discussions
# categoryId 为空时评论区不渲染
[params.giscus]
repo = "sdjhk123/sdjhk123.github.io"
repoId = "R_kgDOVkwRBA"
category = "Announcements"
categoryId = "DIC_kwDOVkwRBM4DKuud"

[[menu.main]]
identifier = "posts"
name = "文章"
url = "/posts/"
weight = 10

[[menu.main]]
identifier = "archives"
name = "归档"
url = "/archives/"
weight = 20

[[menu.main]]
identifier = "categories"
name = "分类"
url = "/categories/"
weight = 25

[[menu.main]]
identifier = "tags"
name = "标签"
url = "/tags/"
weight = 30

[[menu.main]]
identifier = "search"
name = "搜索"
url = "/search/"
weight = 40
